services:
  network-directory:
    build: .
    container_name: network-directory
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      NETWORK_CIDR: "192.168.1.0/24"
      APP_PORT: "8088"
      AUTO_SCAN_MINUTES: "5"
      TZ: "America/Chicago"
    volumes:
      - ./data:/data
